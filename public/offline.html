<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - eJeweller</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            max-width: 450px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .logo-img {
            position: relative;
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #f97316, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff;
            text-decoration: none;
            padding: 14px 30px;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.5);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <div class="pulse"></div>
            <img class="logo-img" id="offline-logo" src="/images/icons/icon-192x192.png" alt="eJeweller Logo">
        </div>
        <h1>You are Offline</h1>
        <p>It seems you are not connected to the internet. Please check your network connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            try {
                // Try loading the website's dynamic logo from persistent localStorage
                const vuexStr = localStorage.getItem('vuex');
                if (vuexStr) {
                    const vuex = JSON.parse(vuexStr);
                    const logoUrl = vuex?.frontendSetting?.lists?.theme_logo;
                    if (logoUrl) {
                        document.getElementById('offline-logo').src = logoUrl;
                    }
                }
            } catch (e) {
                console.error("Failed to load dynamic offline logo:", e);
            }
        });
    </script>
</body>
</html>
